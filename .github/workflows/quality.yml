name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Codex Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Prisma engines (no database access)
        run: node node_modules/@prisma/engines/scripts/postinstall.js

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify School OS
        run: npm run codex:verify
        env:
          CODEX_VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
